<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amcrest Console</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <main>
    <h1>Amcrest Console</h1>

    <section id="login-view" hidden>
      <p class="muted">Sign in to the camera. Credentials stay in the proxy's memory.</p>
      <form id="login-form">
        <label>Username
          <input id="login-user" name="user" value="admin" autocomplete="username" required>
        </label>
        <label>Password
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Sign in</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="console-view" hidden>
      <div class="toolbar">
        <span id="camera-name" class="camera-name"></span>
        <button id="refresh" type="button">Refresh snapshot</button>
        <button id="logout" type="button" class="secondary">Log out</button>
      </div>
      <p id="camera-info" class="muted"></p>
      <div class="snapshot-wrap">
        <img id="snapshot" alt="Camera snapshot">
      </div>
      <p id="status" class="error" role="alert"></p>
    </section>
  </main>
  <script src="static/app.js"></script>
</body>
</html>
